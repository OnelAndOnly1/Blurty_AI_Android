name: Build Blurty AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q Blurty_AI_Android_GitHub_APK.zip -d extracted

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: extracted/Blurty_AI_Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blurty-AI-APK
          path: extracted/Blurty_AI_Android/app/build/outputs/apk/debug/app-debug.apk
